<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Store - Home Page</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="apple-touch-icon" sizes="180x180" href="src/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="src/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="src/assets/favicon/favicon-16x16.png">
</head>

<body>

    <nav class="navbar">
        <div class="container_nav">
            <a href="index.html" class="logo"><img src="src/assets/logo_nav_light.png" id="logo" alt=""></a>
            <input type="text" id="search_input" placeholder="Search product...">
            <div class="right_nav">
                <div class="theme">
                    <i class="fa-regular fa-sun"></i>
                    <i class="fa-regular fa-moon"></i>
                    <div class="active_theme"></div>
                </div>
                <a href="cart.html" class="cart"><i class="fa-solid fa-cart-shopping"><span id="cart_count"></span></i></a>
                <button id="login_link">Log in</button>
            </div>
            <div class="bars"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <div class="container">
        <ul class="categories"></ul>

        <main class="products"></main>

        <ul class="pagenation"></ul>
    </div>

    <footer>
        <div class="container_footer container">
            <h3>TechStore online shop</h3>
            <p>© 2026 TechStore. All rights reserved.</p>
            <span>
                <a>Privacy Policy</a>
                <a>Terms of Use</a>
            </span>
        </div>
    </footer>

    <div class="login_screen">
        <form class="login_tab">
            <div class="close_icon"><i class="fa-solid fa-xmark"></i></div>
            <div class="logo"><img src="src/assets/logo_nav_light.png" alt="" id="login_tab_logo"></div>
            <h1>Login</h1>
            
            <label for="login_input">Login</label>
            <input type="text" id="login_input" placeholder="Login or email" value="admin" required>

            <label for="password_input">Password</label>
            <span><input type="password" id="password_input" placeholder="Password" value="admin123" required><i id="eye_icon" class="fa-regular fa-eye"></i></span>


            <a href="">Forgot password?</a>

            <button type="submit">Log in</button>
        </form>

    </div>

    <div class="form_screen">
        <form class="form_tab">
            <div class="close_icon"><i class="fa-solid fa-xmark"></i></div>
            <div class="logo"><img src="src/assets/logo_nav_light.png" alt="" id="form_tab_logo"></div>
            <div class="img_box"><img id="previewImg" src="" alt=""></div>
            <label for="product_img_input">Product image</label>
            <input type="file" id="product_img_input">

            <label for="product_name_input">Product Name</label>
            <input type="text" id="product_name_input" placeholder="Product name" required>

            <label for="product_price_input">Product price ($)</label>
            <input type="number" id="product_price_input" placeholder="Product price" required>

            <label for="product_category_input">Category</label>
            <input type="text" id="product_category_input" placeholder="ex. chone, computer, charger" required>

            <button id="post_btn" type="submit">Add product</button>
        </form>
    </div>

    <span class="alert"></span>
    <script src="src/main.js"></script>
</body>

</html>
